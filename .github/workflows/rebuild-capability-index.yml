name: Rebuild capability index

# Recomputes every data file's `capabilities` cache fresh from its
# `observations` log, then rebuilds data/index.json from the result — and
# commits straight to main, no PR, since both are 100% derived and never
# hand-patched, so there's nothing here for a human to actually review.
#
# Recomputing capabilities here (not just re-aggregating whatever's already
# stored) matters because that's the only recompute path that runs against
# *every* file on disk. ingest-submission.yml only recomputes the one file
# tied to the issue that triggered it — so any file written before the
# observations/capabilities data model existed (a bare array of raw
# observations, no `capabilities` at all) or any file that hasn't had a new
# submission since a bugfix to the recompute logic itself stays stuck with a
# stale or missing `capabilities` cache forever, even though its raw
# observations are perfectly good evidence. This workflow's recompute step
# is copied verbatim from ingest-submission.yml's, applied to every file, so
# nothing gets left behind.
#
# Two triggers:
#   - workflow_dispatch: a manual "Run workflow" button in the Actions tab
#     (or `gh workflow run rebuild-capability-index.yml`) — use this any
#     time you suspect data/index.json is stale or missing entries, or right
#     after adding this workflow for the first time to backfill everything
#     already on disk.
#   - push to main touching data/** (except index.json itself, to avoid
#     triggering on its own commits): keeps things in sync automatically.
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "data/**"
      - "!data/index.json"

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Recompute capabilities + rebuild data/index.json
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const path = require("path");

            const walkDataFiles = (dir) => {
              let out = [];
              for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
                const full = path.join(dir, entry.name);
                if (entry.isDirectory()) {
                  out = out.concat(walkDataFiles(full));
                } else if (
                  entry.isFile() &&
                  entry.name.endsWith(".json") &&
                  full !== path.join("data", "index.json")
                ) {
                  out.push(full);
                }
              }
              return out;
            };

            // Identical to ingest-submission.yml's recompute logic — kept
            // in lockstep deliberately (see header comment) so an
            // already-correct file produces byte-identical output here and
            // never gets needlessly rewritten.
            //
            // flattenObservation() expands the card's per-device submission
            // shape ({ endpoints: [{ endpoint, scanned, clusters }, ...] })
            // into one item per endpoint before grouping — see the matching
            // comment in ingest-submission.yml for why this exists: the
            // previous version of this function assumed a single top-level
            // `endpoint`/`clusters` pair per observation, a shape the card
            // has never actually produced, so it silently computed
            // endpoint: undefined and clusters: {} for every multi-endpoint
            // submission already on disk. Older files whose observations
            // already use the single-endpoint shape directly still work
            // unchanged via the second branch.
            const flattenObservation = (o) => {
              if (Array.isArray(o.endpoints)) {
                return o.endpoints.map((ep) => ({
                  manufacturer: o.manufacturer,
                  model: o.model,
                  identity: o.identity,
                  endpoint: ep.endpoint,
                  clusters: ep.scanned ? ep.clusters || {} : {},
                  provenance: o.provenance,
                }));
              }
              if (o.endpoint) {
                return [
                  {
                    manufacturer: o.manufacturer,
                    model: o.model,
                    identity: o.identity,
                    endpoint: o.endpoint,
                    clusters: o.clusters || {},
                    provenance: o.provenance,
                  },
                ];
              }
              return [];
            };
            const recomputeCapabilities = (observations) => {
              const flatObservations = observations.flatMap(flattenObservation);
              const obsKey = (o) =>
                `${(o.endpoint || {}).id}|${(o.identity || {}).sw_build_id || "unknown"}`;
              const keys = [...new Set(flatObservations.map(obsKey))];
              const capabilities = {};

              keys.forEach((key) => {
                const matching = flatObservations.filter((o) => obsKey(o) === key);
                const first = matching[0];

                const clusterIds = new Set();
                matching.forEach((o) =>
                  Object.keys(o.clusters || {}).forEach((k) => clusterIds.add(k))
                );

                const clusters = {};
                clusterIds.forEach((hexKey) => {
                  const perObs = matching.map((o) => (o.clusters || {})[hexKey]).filter(Boolean);
                  if (!perObs.length) return;

                  const confirmedObs = perObs.filter((c) => c.commands_received_confirmed);
                  const rowsById = new Map();
                  confirmedObs.forEach((c) => {
                    (c.commands_received || []).forEach((row) => {
                      if (!rowsById.has(row.id)) {
                        rowsById.set(row.id, { id: row.id, name: row.name, votes: [] });
                      }
                      rowsById.get(row.id).votes.push(row.present);
                    });
                  });
                  const commands_received = [...rowsById.values()].map((r) => {
                    const allTrue = r.votes.every((v) => v === true);
                    const allFalse = r.votes.every((v) => v === false);
                    return {
                      id: r.id,
                      name: r.name,
                      present: allTrue ? true : allFalse ? false : null,
                      conflicting: !allTrue && !allFalse,
                      scan_count: r.votes.length,
                    };
                  });

                  const attrById = new Map();
                  perObs.forEach((c) =>
                    (c.attributes_confirmed || []).forEach((a) => attrById.set(a.id, a))
                  );

                  clusters[hexKey] = {
                    name: perObs[0].name,
                    commands_received,
                    commands_received_scan_count: confirmedObs.length,
                    attributes_confirmed: [...attrById.values()],
                  };
                });

                const lastSeen = matching
                  .map((o) => (o.provenance || {}).submitted_at)
                  .filter(Boolean)
                  .sort()
                  .pop() || null;

                capabilities[key] = {
                  endpoint: (first.endpoint || {}).id,
                  firmware: (first.identity || {}).sw_build_id || null,
                  scan_count: matching.length,
                  last_seen: lastSeen,
                  manufacturer: first.manufacturer,
                  model: first.model,
                  in_clusters: [
                    ...new Set(matching.flatMap((o) => (o.endpoint || {}).in_clusters || [])),
                  ],
                  out_clusters: [
                    ...new Set(matching.flatMap((o) => (o.endpoint || {}).out_clusters || [])),
                  ],
                  clusters,
                };
              });

              return capabilities;
            };

            // ---------------------------------------------------------------
            // Unknown capability labeling (see PRD: "Unknown Capability
            // Labeling and Device Photos"). Manufacturer-specific
            // (0xFC00-0xFFFF) clusters/attributes routinely show up in scans
            // as raw hex IDs because the scanning device's own local ZHA
            // install doesn't have a quirk loaded for them. Where
            // data/_upstream-cluster-map.json (hand-curated from actual
            // zha-device-handlers/zigpy source, see that file's own header)
            // has a match, this annotates the cache with an additive
            // resolved_name/resolved_source pair — the original raw name/ID
            // is never removed or overwritten, only supplemented. Anything
            // still unresolved after this is collected into
            // data/unknown-capabilities.json below instead of silently
            // staying invisible.
            //
            // Deliberately fails soft: a missing or unreadable map file
            // just means this run enriches nothing, never blocks the index
            // rebuild that's the whole point of this workflow.
            let upstreamMap = { global_attributes: {}, clusters: [] };
            try {
              upstreamMap = JSON.parse(fs.readFileSync("data/_upstream-cluster-map.json", "utf8"));
            } catch (e) {
              console.log(`Could not read data/_upstream-cluster-map.json (${e.message}) — enrichment will run with an empty map this time.`);
            }

            const GENERIC_CLUSTER_NAME_RE = /^(cluster 0x[0-9a-f]{4}|manufacturer specific)$/i;
            const NUMERIC_NAME_RE = /^\d+$/;

            // Same-vendor, different-product-line collisions are real (see
            // the map file's own header comment — Sonoff alone reuses
            // 0xFC11 for four unrelated attribute sets), so an exact
            // manufacturer+model entry always wins over a manufacturer-wide
            // one, which in turn wins over a global (no-manufacturer) entry
            // like WWAH.
            function findClusterMapping(manufacturer, model, idHex) {
              const mfr = (manufacturer || "").trim().toLowerCase();
              const mdl = (model || "").trim().toLowerCase();
              const candidates = (upstreamMap.clusters || []).filter(
                (c) => (c.id_hex || "").toLowerCase() === idHex.toLowerCase()
              );
              const modelMatch = candidates.find(
                (c) => (c.manufacturer || "").toLowerCase() === mfr && c.model && c.model.toLowerCase() === mdl
              );
              if (modelMatch) return modelMatch;
              const mfrMatch = candidates.find(
                (c) => (c.manufacturer || "").toLowerCase() === mfr && !c.model
              );
              if (mfrMatch) return mfrMatch;
              return candidates.find((c) => !c.manufacturer) || null;
            }

            // Mutates a freshly-recomputed capabilities object in place
            // (adding resolved_name/resolved_source where matches are
            // found) and returns whatever's left unresolved, aggregated by
            // ID with a per-device seen count, for the caller to fold into
            // the global unknown-capabilities tracker.
            function enrichCapabilities(capabilities) {
              const unresolvedClusters = new Map();
              const unresolvedAttrs = new Map();

              const bump = (map, key, base, manufacturer, model) => {
                if (!map.has(key)) map.set(key, { ...base, seen_on: new Map() });
                const entry = map.get(key);
                const seenKey = `${manufacturer || "unknown"}|${model || "unknown"}`;
                entry.seen_on.set(seenKey, (entry.seen_on.get(seenKey) || 0) + 1);
              };

              Object.values(capabilities).forEach((entry) => {
                const manufacturer = entry.manufacturer;
                const model = entry.model;
                Object.entries(entry.clusters || {}).forEach(([idHex, cluster]) => {
                  const num = parseInt(idHex, 16);
                  if (!Number.isFinite(num) || num < 0xfc00 || num > 0xffff) return; // only the manufacturer-specific range needs this at all

                  const mapping = findClusterMapping(manufacturer, model, idHex);

                  const looksUnresolved = !cluster.name || GENERIC_CLUSTER_NAME_RE.test(cluster.name);
                  if (looksUnresolved) {
                    if (mapping && mapping.name) {
                      cluster.resolved_name = mapping.name;
                      cluster.resolved_source = mapping.source || "zha-device-handlers";
                    } else {
                      bump(unresolvedClusters, idHex, { id_hex: idHex }, manufacturer, model);
                    }
                  }

                  // Attribute-level enrichment runs independently of
                  // whether the cluster name itself resolved — a cluster
                  // can already have a real name (from the submitter's own
                  // local zigpy/ZHA install) while individual attributes
                  // still came back as bare numeric IDs.
                  (cluster.attributes_confirmed || []).forEach((attr) => {
                    if (attr.name && !NUMERIC_NAME_RE.test(String(attr.name))) return; // already named
                    const idNum = Number(attr.id);
                    const globalAttr = (upstreamMap.global_attributes || {})[String(idNum)];
                    if (globalAttr && globalAttr.name) {
                      attr.resolved_name = globalAttr.name;
                      attr.resolved_source = globalAttr.source || "zcl-spec";
                      return;
                    }
                    const clusterAttrName = mapping && mapping.attributes && mapping.attributes[String(idNum)];
                    if (clusterAttrName) {
                      attr.resolved_name = clusterAttrName;
                      attr.resolved_source = mapping.source || "zha-device-handlers";
                      return;
                    }
                    bump(
                      unresolvedAttrs,
                      `${idHex}|${attr.id}`,
                      { cluster_id_hex: idHex, id_hex: `0x${idNum.toString(16).padStart(4, "0")}` },
                      manufacturer,
                      model
                    );
                  });
                });
              });

              const finalize = (map) =>
                [...map.values()].map((v) => ({
                  ...v,
                  seen_on: [...v.seen_on.entries()].map(([key, count]) => {
                    const [manufacturer, model] = key.split("|");
                    return { manufacturer, model, count };
                  }),
                }));

              return { unresolvedClusters: finalize(unresolvedClusters), unresolvedAttrs: finalize(unresolvedAttrs) };
            }

            // Merges the per-file unresolved lists collected below into one
            // global list per ID, summing seen counts across files/devices
            // — the same manufacturer-specific cluster commonly shows up on
            // several different models.
            function mergeUnresolved(rows, keyFn) {
              const merged = new Map();
              rows.forEach((row) => {
                const key = keyFn(row);
                if (!merged.has(key)) merged.set(key, { ...row, seen_on: new Map() });
                const target = merged.get(key);
                (row.seen_on || []).forEach((s) => {
                  const seenKey = `${s.manufacturer}|${s.model}`;
                  target.seen_on.set(seenKey, (target.seen_on.get(seenKey) || 0) + s.count);
                });
              });
              return [...merged.values()]
                .map((v) => ({
                  ...v,
                  seen_on: [...v.seen_on.entries()]
                    .map(([k, count]) => {
                      const [manufacturer, model] = k.split("|");
                      return { manufacturer, model, count };
                    })
                    .sort((a, b) => b.count - a.count),
                }))
                .sort((a, b) => {
                  const totalA = a.seen_on.reduce((s, x) => s + x.count, 0);
                  const totalB = b.seen_on.reduce((s, x) => s + x.count, 0);
                  return totalB - totalA;
                });
            }

            let changedFiles = 0;
            const index = [];
            const allUnresolvedClusters = [];
            const allUnresolvedAttrs = [];

            if (fs.existsSync("data")) {
              for (const file of walkDataFiles("data")) {
                let parsed;
                try {
                  parsed = JSON.parse(fs.readFileSync(file, "utf8"));
                } catch (e) {
                  console.log(`Skipping ${file} — not valid JSON.`);
                  continue;
                }

                const wasBareArray = Array.isArray(parsed);
                const existing = wasBareArray ? { observations: parsed, capabilities: {} } : parsed;
                if (!Array.isArray(existing.observations)) existing.observations = [];

                const recomputed = recomputeCapabilities(existing.observations);
                const before = JSON.stringify(existing.capabilities || {});
                // Enrichment mutates recomputed's cluster/attribute objects
                // in place, so it must run before `after` is captured —
                // otherwise a file whose observations didn't change but
                // whose upstream map just gained a new entry would never
                // get rewritten, and previously-unresolved data would stay
                // unresolved forever instead of picking up new mappings
                // retroactively.
                const { unresolvedClusters, unresolvedAttrs } = enrichCapabilities(recomputed);
                allUnresolvedClusters.push(...unresolvedClusters);
                allUnresolvedAttrs.push(...unresolvedAttrs);
                const after = JSON.stringify(recomputed);
                existing.capabilities = recomputed;

                if (before !== after || wasBareArray) {
                  fs.writeFileSync(file, JSON.stringify(existing, null, 2) + "\n");
                  changedFiles++;
                  console.log(
                    wasBareArray
                      ? `Migrated ${file} from the old bare-array schema and computed its capabilities cache.`
                      : `Recomputed ${file} — capabilities cache was out of date.`
                  );
                }

                const parts = file.split(path.sep); // ["data", manufacturerSlug, "model.json"]
                const manufacturerSlug = parts[1];
                const modelSlug = (parts[2] || "").replace(/\.json$/, "");
                Object.values(existing.capabilities).forEach((entry) => {
                  index.push({
                    manufacturer_slug: manufacturerSlug,
                    model_slug: modelSlug,
                    ...entry,
                  });
                });
              }
            }

            index.sort((a, b) =>
              `${a.manufacturer}${a.model}${a.firmware}`.localeCompare(
                `${b.manufacturer}${b.model}${b.firmware}`
              )
            );
            const nextIndex = JSON.stringify(index, null, 2) + "\n";
            const prevIndex = fs.existsSync("data/index.json")
              ? fs.readFileSync("data/index.json", "utf8")
              : null;
            const indexChanged = prevIndex !== nextIndex;
            if (indexChanged) fs.writeFileSync("data/index.json", nextIndex);

            // data/unknown-capabilities.json — every manufacturer-specific
            // cluster/attribute seen anywhere in the database that
            // enrichCapabilities() couldn't resolve, aggregated once across
            // every file (the per-file pass above only sees its own file's
            // devices). Compared ignoring generated_at so a run that
            // changes nothing real doesn't touch the file just to bump a
            // timestamp.
            const unknownDoc = {
              generated_at: new Date().toISOString(),
              unresolved_clusters: mergeUnresolved(allUnresolvedClusters, (r) => r.id_hex),
              unresolved_attributes: mergeUnresolved(allUnresolvedAttrs, (r) => `${r.cluster_id_hex}|${r.id_hex}`),
            };
            const nextUnknown = JSON.stringify(unknownDoc, null, 2) + "\n";
            const prevUnknown = fs.existsSync("data/unknown-capabilities.json")
              ? fs.readFileSync("data/unknown-capabilities.json", "utf8")
              : null;
            const stripTimestamp = (s) => (s ? s.replace(/"generated_at": ".*?"/, '"generated_at": ""') : s);
            const unknownChanged = stripTimestamp(prevUnknown) !== stripTimestamp(nextUnknown);
            if (unknownChanged) fs.writeFileSync("data/unknown-capabilities.json", nextUnknown);

            if (changedFiles === 0 && !indexChanged && !unknownChanged) {
              console.log(`Nothing to rebuild — every file's capabilities cache, data/index.json, and data/unknown-capabilities.json were already up to date (${index.length} records).`);
              return;
            }

            await exec.exec("git", ["config", "user.name", "github-actions[bot]"]);
            await exec.exec("git", [
              "config",
              "user.email",
              "github-actions[bot]@users.noreply.github.com",
            ]);
            await exec.exec("git", ["add", "data/"]);
            await exec.exec("git", [
              "commit",
              "-m",
              `Rebuild capability index (${index.length} records, ${changedFiles} file(s) recomputed${unknownChanged ? ", unknown-capabilities.json updated" : ""})`,
            ]);
            await exec.exec("git", ["push", "origin", "HEAD:main"]);
            console.log(`Committed: ${index.length} records in data/index.json, ${changedFiles} file(s) recomputed, ${unknownDoc.unresolved_clusters.length} unresolved cluster(s) and ${unknownDoc.unresolved_attributes.length} unresolved attribute(s) tracked.`);
