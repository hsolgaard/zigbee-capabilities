# Generated by .github/scripts/build-issue-form.cjs from data/questions.json. Don't edit by hand.
name: "Device answers: how a device behaves"
description: "Tell the next person how a Zigbee device behaves in real use: things a capability scan can't show."
title: "[Device Answers] <manufacturer> <model>"
labels: [device-answers]
body:
  - type: markdown
    attributes:
      value: "Answer for **one device you own**. Every question is optional apart from the device, its firmware and what you use it for. Choose \"Doesn't apply\" for anything that doesn't fit. Answers are kept per firmware version and shown as counts, never as a verdict. Don't include names, places or addresses: free text is reviewed before it's shown.\n\nUsing ZHA Bindings Manager? Its device side panel asks only the questions that apply and fills in the firmware for you."
  - type: input
    attributes:
      label: "Manufacturer"
      description: "Exactly as your Zigbee system shows it, e.g. IKEA of Sweden"
    validations:
      required: true
  - type: input
    attributes:
      label: "Model"
      description: "Exactly as your Zigbee system shows it, e.g. RODRET Dimmer"
    validations:
      required: true
  - type: input
    attributes:
      label: "Firmware version"
      description: "The device's firmware (software build) version, e.g. 1.0.5 or 0x00000017"
    validations:
      required: true
  - type: dropdown
    attributes:
      label: "Device type"
      options:
        - "Remote, button or battery switch (sends commands, no load)"
        - "Wall switch or rocker with a relay (can switch a load)"
        - "Light, bulb or LED driver"
        - "Plug, socket or in-line relay"
        - "Blind, curtain or shutter motor"
        - "Sensor (motion, contact, temperature, leak…)"
        - "Something else"
    validations:
      required: true
  - type: dropdown
    attributes:
      label: "What do you use this one for?"
      description: "Answer for this one device. Everything else is read in the light of it: a rocker can be great as a wired switch and poor as a remote."
      options:
        - "Remote, button or battery switch: Controlling lights directly (bound to them or to a group)"
        - "Remote, button or battery switch: Buttons for automations only"
        - "Remote, button or battery switch: Scene controller"
        - "Wall switch or rocker with a relay: Wired, switching its own light"
        - "Wall switch or rocker with a relay: Wired, button separated from the relay, controlling smart bulbs"
        - "Wall switch or rocker with a relay: Not switching a load: used as a remote"
        - "Wall switch or rocker with a relay: Buttons for automations only"
        - "Light, bulb or LED driver: Main room light"
        - "Light, bulb or LED driver: Lamp"
        - "Light, bulb or LED driver: Accent, strip or spot"
        - "Light, bulb or LED driver: Outdoor"
        - "Plug, socket or in-line relay: A lamp"
        - "Plug, socket or in-line relay: An appliance"
        - "Plug, socket or in-line relay: Mainly measuring power"
        - "Plug, socket or in-line relay: Mainly as a router (repeater)"
        - "Blind, curtain or shutter motor: Roller or venetian blind"
        - "Blind, curtain or shutter motor: Curtain"
        - "Blind, curtain or shutter motor: Shutter or garage door"
        - "Sensor: Switching lights"
        - "Sensor: Security or alarm"
        - "Sensor: Heating or climate"
        - "Sensor: Leak or safety"
        - "Something else: General use"
        - "Other (please say below)"
    validations:
      required: true
  - type: dropdown
    attributes:
      label: "Does it stay connected?"
      options:
        - "Always"
        - "Drops off occasionally"
        - "Drops off often"
        - "Doesn't apply"
    validations:
      required: false
  - type: dropdown
    attributes:
      label: "Which routers does it work through?"
      description: "Some devices only stay connected through certain brands of router, or only directly to the coordinator. Only for: Remote, button or battery switch, Sensor, Something else."
      options:
        - "Any router"
        - "Only some brands"
        - "Only directly to the coordinator"
        - "Not sure"
        - "Doesn't apply"
    validations:
      required: false
  - type: dropdown
    attributes:
      label: "If it drops off, does it come back?"
      options:
        - "Yes, by itself"
        - "After a button press"
        - "Only by pairing it again"
        - "It has never dropped"
        - "Doesn't apply"
    validations:
      required: false
  - type: dropdown
    attributes:
      label: "Did pairing work as the manual says?"
      options:
        - "First time"
        - "Took several tries"
        - "It needed a trick (tell us)"
        - "Doesn't apply"
    validations:
      required: false
  - type: dropdown
    attributes:
      label: "Does it control lights directly when your Zigbee system or Home Assistant is off?"
      description: "Bound straight to the lights, not through an automation. Only for: Remote, button or battery switch, Wall switch or rocker with a relay."
      options:
        - "Yes, bound to the lights"
        - "Only through a group"
        - "No"
        - "Didn't try"
        - "Doesn't apply"
    validations:
      required: false
  - type: dropdown
    attributes:
      label: "What does a press send?"
      description: "With Toggle, two remotes on the same light can get out of step; separate On and Off can't. Only for: Remote, button or battery switch, Wall switch or rocker with a relay."
      options:
        - "Toggle"
        - "Separate On and Off"
        - "Depends on a mode setting"
        - "Not sure"
        - "Doesn't apply"
    validations:
      required: false
  - type: dropdown
    attributes:
      label: "Did it need a setting changed before it controlled lights directly?"
      description: "Only for: Remote, button or battery switch, Wall switch or rocker with a relay."
      options:
        - "No"
        - "Yes, a mode setting"
        - "Yes, a button sequence"
        - "It never worked"
        - "Not sure"
        - "Yes, something else (tell us)"
        - "Doesn't apply"
    validations:
      required: false
  - type: dropdown
    attributes:
      label: "Does every press arrive?"
      description: "Only for: Remote, button or battery switch, Wall switch or rocker with a relay."
      options:
        - "Always"
        - "Sometimes missed"
        - "Often missed"
        - "Doesn't apply"
    validations:
      required: false
  - type: dropdown
    attributes:
      label: "Does holding a button dim the lights?"
      description: "Only for: Remote, button or battery switch, Wall switch or rocker with a relay."
      options:
        - "Yes"
        - "No"
        - "It has no dim buttons"
        - "Not sure"
        - "Doesn't apply"
    validations:
      required: false
  - type: dropdown
    attributes:
      label: "Does it keep its bindings after a battery change, power cut or firmware update?"
      description: "Only for: Remote, button or battery switch, Wall switch or rocker with a relay."
      options:
        - "Yes"
        - "It lost them"
        - "Haven't had one yet"
        - "Doesn't apply"
    validations:
      required: false
  - type: dropdown
    attributes:
      label: "Can the button be separated from the relay (decoupled mode)?"
      description: "Only for: Wall switch or rocker with a relay."
      options:
        - "Yes, a setting in my Zigbee system"
        - "Yes, a button sequence on the device"
        - "No"
        - "Not sure"
        - "Yes, another way (tell us)"
        - "Doesn't apply"
    validations:
      required: false
  - type: dropdown
    attributes:
      label: "How is it wired?"
      description: "Only for: Wall switch or rocker with a relay."
      options:
        - "With neutral"
        - "Without neutral, works fine"
        - "Without neutral, flickers or has problems"
        - "Battery, not wired"
        - "Doesn't apply"
    validations:
      required: false
  - type: dropdown
    attributes:
      label: "What does it do after a power cut?"
      description: "Many devices list a power-on setting that they don't actually honour. Only for: Light, bulb or LED driver, Plug, socket or in-line relay, Wall switch or rocker with a relay."
      options:
        - "Goes back to how it was"
        - "Always comes on"
        - "Always stays off"
        - "Ignores its power-on setting"
        - "Not sure"
        - "Doesn't apply"
    validations:
      required: false
  - type: dropdown
    attributes:
      label: "After a power cut, does it remember brightness and colour too?"
      description: "Only for: Light, bulb or LED driver."
      options:
        - "Yes"
        - "Only on or off"
        - "No"
        - "Not sure"
        - "Doesn't apply"
    validations:
      required: false
  - type: dropdown
    attributes:
      label: "Is it a good router for other devices?"
      description: "Only for: Light, bulb or LED driver, Plug, socket or in-line relay, Wall switch or rocker with a relay."
      options:
        - "Yes"
        - "Devices connected through it drop off"
        - "Not sure"
        - "Doesn't apply"
    validations:
      required: false
  - type: dropdown
    attributes:
      label: "Does the position it reports match where it really is?"
      description: "Only for: Blind, curtain or shutter motor."
      options:
        - "Yes"
        - "Drifts over time"
        - "No"
        - "Doesn't apply"
    validations:
      required: false
  - type: dropdown
    attributes:
      label: "Do its reports arrive promptly?"
      description: "Only for: Sensor."
      options:
        - "Straight away"
        - "Noticeably delayed"
        - "Some go missing"
        - "Doesn't apply"
    validations:
      required: false
  - type: dropdown
    attributes:
      label: "How long do its batteries last?"
      description: "Only for: Remote, button or battery switch, Sensor, Blind, curtain or shutter motor, Wall switch or rocker with a relay."
      options:
        - "Less than a month"
        - "1 to 6 months"
        - "6 to 12 months"
        - "Over a year"
        - "Too early to say"
        - "It isn't battery powered"
        - "Doesn't apply"
    validations:
      required: false
  - type: dropdown
    attributes:
      label: "Is the battery level it reports right?"
      description: "Only for: Remote, button or battery switch, Sensor, Blind, curtain or shutter motor, Wall switch or rocker with a relay."
      options:
        - "Yes"
        - "Drops suddenly near the end"
        - "Stuck or never changes"
        - "It doesn't report one"
        - "It isn't battery powered"
        - "Doesn't apply"
    validations:
      required: false
  - type: dropdown
    attributes:
      label: "Has your Zigbee system offered it a firmware update?"
      options:
        - "Yes, and it worked"
        - "Yes, but it failed"
        - "Never offered"
        - "Not sure"
        - "Doesn't apply"
    validations:
      required: false
  - type: dropdown
    attributes:
      label: "Did a firmware update change any of the above?"
      description: "Asked when you answered before on a different firmware."
      options:
        - "Better"
        - "Worse"
        - "No change"
        - "Yes, something specific (tell us)"
        - "Doesn't apply"
    validations:
      required: false
  - type: textarea
    attributes:
      label: "If you chose an \"other\" answer, tell us more"
      description: "Up to 280 characters."
    validations:
      required: false
  - type: dropdown
    attributes:
      label: "Ignoring price, how good is it at what you use it for?"
      description: "Optional. Subjective, so it's shown as a spread of ratings, and only averaged once 3 people have rated."
      options:
        - "1 – Poor"
        - "2 – Not great"
        - "3 – OK"
        - "4 – Good"
        - "5 – Excellent"
    validations:
      required: false
  - type: dropdown
    attributes:
      label: "Which Zigbee system do you use it with?"
      options:
        - "ZHA (Home Assistant)"
        - "Zigbee2MQTT"
        - "deCONZ / Phoscon"
        - "A vendor hub (Hue, IKEA, Aqara…)"
        - "Something else"
    validations:
      required: false
  - type: dropdown
    attributes:
      label: "What chip is your coordinator?"
      description: "Some behaviour depends on the coordinator, not the device."
      options:
        - "Silicon Labs (EFR32 / EmberZNet, e.g. Sonoff Dongle-E/M, SkyConnect, ZBT-1)"
        - "Texas Instruments (CC2652 / CC1352, e.g. Sonoff Dongle-P)"
        - "ConBee / RaspBee"
        - "Something else"
        - "Not sure"
    validations:
      required: false
  - type: dropdown
    attributes:
      label: "How long have you had it?"
      options:
        - "Less than a month"
        - "1 to 12 months"
        - "Over a year"
    validations:
      required: false
  - type: textarea
    attributes:
      label: "Anything the next person should know?"
      description: "Optional, up to 280 characters. No names, places or addresses. Shown after review."
    validations:
      required: false
